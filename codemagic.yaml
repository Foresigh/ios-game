workflows:
  ios-adhoc:
    name: Signal Runner - Ad Hoc
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      # Reference the certificate and Ad Hoc profile by the exact "Reference
      # name" they were given under Team settings -> Code signing identities.
      ios_signing:
        certificates:
          - signalrunner-distribution
        provisioning_profiles:
          - signalrunner-adhoc-profile
      vars:
        # The Xcode scheme name (matches your project's default scheme unless renamed)
        XCODE_SCHEME: "SignalRunner"
        # The .xcodeproj file name as created by the Xcode wizard
        XCODE_PROJECT: "SignalRunner.xcodeproj"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Generate the Xcode project (XcodeGen)
        script: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Configure signing settings
        # NOTE: no `keychain initialize` here on purpose — Codemagic's own
        # automatic "Set up code signing identities" step (triggered by
        # environment.ios_signing) already created and populated the
        # keychain with our certificate; re-initializing it here would wipe
        # that out. This step only applies the profile to the project and
        # writes export_options.plist, which build-ipa needs next.
        script: |
          xcode-project use-profiles

      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - fayisa23@gmail.com
        notify:
          success: true
          failure: true
