workflows:
  ios-adhoc:
    name: Signal Runner - Ad Hoc
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      # Name of the App Store Connect API key integration set up under
      # Codemagic -> Team settings -> Integrations -> Apple Developer Portal.
      app_store_connect: ios-game
    environment:
      xcode: latest
      # Declarative signing config: combined with the integrations block
      # above, `xcode-project use-profiles` fetches/creates the matching
      # certificate + Ad Hoc profile automatically — no manual
      # `app-store-connect fetch-signing-files` call needed.
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.kayi.signalrunner
      vars:
        # The Xcode scheme name (matches your project's default scheme unless renamed)
        XCODE_SCHEME: "SignalRunner"
        # The .xcodeproj file name as created by the Xcode wizard
        XCODE_PROJECT: "SignalRunner.xcodeproj"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Generate the Xcode project (XcodeGen)
        script: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Set up code signing (Ad Hoc)
        script: |
          keychain initialize
          xcode-project use-profiles

      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - fayisa23@gmail.com
        notify:
          success: true
          failure: true
