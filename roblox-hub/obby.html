<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SKYRISE OBBY</title>
<style>
  :root{ --ui:#eaf2ff; --accent:#ffd34d; --accent2:#6cf0ff; --panel:rgba(10,14,26,.72); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#05070d;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; color:var(--ui); user-select:none; }
  canvas{ display:block; }
  #hud{ position:fixed; inset:0; pointer-events:none; }
  #cross{ position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px;
    border-radius:50%; background:#fff; opacity:.8; }
  .pill{ position:absolute; top:16px; background:var(--panel); border:1px solid rgba(255,255,255,.12);
    border-radius:10px; padding:6px 14px; font-size:14px; }
  #stage{ left:16px; } #stage b{ color:var(--accent); }
  a.back{ position:absolute; left:18px; top:64px; color:#9aa8c2; font-size:13px; text-decoration:none;
    letter-spacing:1px; pointer-events:auto; }
  #fallmsg{ position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); font-size:22px;
    letter-spacing:2px; opacity:0; transition:opacity .2s; color:var(--accent2); }
  #win{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column;
    gap:14px; background:rgba(5,7,13,.85); z-index:10; text-align:center; }
  #win h1{ font-size:44px; margin:0; letter-spacing:4px;
    background:linear-gradient(180deg,#fff,#6cc0e0); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; }
  button{ pointer-events:auto; cursor:pointer; font:inherit; font-size:18px; letter-spacing:2px;
    padding:12px 36px; border-radius:12px; border:none; color:#0a1622; font-weight:bold;
    background:linear-gradient(180deg,#9fe8ff,#3fa0e0); }
  #start{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;
    gap:14px; background:radial-gradient(circle at 50% 35%,#1c3a52 0%,#080c16 70%); z-index:10; text-align:center; }
  #start h1{ font-size:46px; margin:0; letter-spacing:4px;
    background:linear-gradient(180deg,#fff,#6cc0e0); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; }
  .keys{ font-size:13px; opacity:.75; max-width:420px; line-height:1.8; }
  kbd{ background:#ffffff18; border:1px solid #ffffff30; border-radius:5px; padding:1px 7px; font-size:11px; }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div id="start">
  <h1>SKYRISE OBBY</h1>
  <div class="keys"><kbd>WASD</kbd> move &middot; <kbd>Space</kbd> jump &middot; mouse or
    <kbd>Arrow Keys</kbd> look<br/>Reach the top. Falling sends you back to your last checkpoint.</div>
  <button id="playBtn">CLIMB</button>
</div>

<div id="win">
  <h1>SUMMIT REACHED</h1>
  <div id="winTime"></div>
  <button id="againBtn">CLIMB AGAIN</button>
</div>

<div id="hud" class="hidden">
  <div id="cross"></div>
  <div class="pill" id="stage">CHECKPOINT <b>1</b> / <span id="stageMax">6</span></div>
  <a class="back" href="index.html">&larr; BUILD WORLD</a>
  <div id="fallmsg">RESPAWNED</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const el = id => document.getElementById(id);

/* ---------------- platforms ---------------- */
// A spiral tower of platforms. Some oscillate; checkpoints every few steps.
const platforms = [];
const checkpoints = [];
{
  let y = 0, radius = 0, angle = 0;
  const colors = [0x3a8fc0, 0x4fae7a, 0xc07a3a, 0xa03fe0];
  for (let i=0; i<34; i++){
    angle += 0.55 + Math.random()*0.15;
    radius = 6 + i*0.28;
    y += 1.9;
    const x = Math.cos(angle)*radius, z = Math.sin(angle)*radius;
    const isCheckpoint = i % 5 === 0;
    const moving = !isCheckpoint && i>3 && Math.random()<0.4
      ? { axis: Math.random()<0.5?'x':'z', range: 2+Math.random()*2, speed: 0.6+Math.random()*0.6, phase: Math.random()*6 }
      : null;
    const w = isCheckpoint ? 3.2 : 2.1, d = isCheckpoint ? 3.2 : 2.1;
    platforms.push({ x, y, z, w, d, moving, color: isCheckpoint?0xffd34d:colors[i%colors.length], checkpoint:isCheckpoint, index:i });
    if (isCheckpoint) checkpoints.push({ x, y, z, index:i });
  }
  // final platform + flag
  angle += 0.6; radius += 1.5; y += 2.2;
  const fx = Math.cos(angle)*radius, fz = Math.sin(angle)*radius;
  platforms.push({ x:fx, y, z:fz, w:4, d:4, moving:null, color:0xffffff, checkpoint:false, finish:true, index:platforms.length });
}
const STAGE_MAX = checkpoints.length; // not counting the finish
el('stageMax').textContent = STAGE_MAX;

/* ---------------- scene ---------------- */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1c3a52, 20, 140);
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.08, 400);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

(function sky(){
  const c = document.createElement('canvas'); c.width=8; c.height=256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,0,256);
  grd.addColorStop(0,'#122040'); grd.addColorStop(0.5,'#2c4f78'); grd.addColorStop(1,'#7fa8c0');
  g.fillStyle=grd; g.fillRect(0,0,8,256);
  const tex = new THREE.CanvasTexture(c);
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(300,16,12),
    new THREE.MeshBasicMaterial({ map:tex, side:THREE.BackSide, fog:false, depthWrite:false })));
})();

const sun = new THREE.DirectionalLight(0xfff0d0, 2.2);
sun.position.set(40,60,20); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun); scene.add(new THREE.HemisphereLight(0xbdd9ff, 0x2a2a3a, 1.0));

const platMeshes = [];
for (const p of platforms){
  const geo = new THREE.BoxGeometry(p.w, 0.6, p.d);
  const mat = new THREE.MeshStandardMaterial({ color:p.color, roughness:0.7,
    emissive: p.checkpoint||p.finish ? new THREE.Color(p.color).multiplyScalar(0.25) : 0x000000 });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(p.x, p.y, p.z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  p.mesh = m; p.baseX = p.x; p.baseZ = p.z;
  platMeshes.push(m);
  if (p.finish){
    const flag = new THREE.Mesh(new THREE.ConeGeometry(0.6,1.4,8), new THREE.MeshStandardMaterial({ color:0xff5b6e }));
    flag.position.set(p.x, p.y+1.1, p.z);
    scene.add(flag);
  }
}

/* ---------------- player ---------------- */
// world-space direction (dx,dz) -> yaw that makes the camera's forward vector point that way
function faceYaw(dx, dz){ return Math.atan2(-dx, -dz); }
// which yaw to spawn/respawn facing: toward the platform right after the given index
function yawAfter(platformIndex){
  const next = platforms[platformIndex+1];
  const cur = platforms[platformIndex];
  if (!next) return 0;
  return faceYaw(next.x-cur.x, next.z-cur.z);
}

const player = { pos:new THREE.Vector3(platforms[0].x, platforms[0].y+1, platforms[0].z),
  vel:new THREE.Vector3(), yaw:yawAfter(0), pitch:-0.12, onGround:false, stage:0 };
let lastCheckpoint = checkpoints[0];
let startTime = performance.now(), finished = false;

const keys = {};
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
addEventListener('keydown', e=>{ keys[e.code]=true; if(e.code==='Space') e.preventDefault(); });
addEventListener('keyup', e=>{ keys[e.code]=false; });
document.addEventListener('mousemove', e=>{
  if (document.pointerLockElement !== renderer.domElement) return;
  player.yaw -= e.movementX*0.0022; player.pitch -= e.movementY*0.0022;
  player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
});
renderer.domElement.addEventListener('click', ()=>{ if(!isTouch) renderer.domElement.requestPointerLock(); });

function respawn(){
  player.pos.set(lastCheckpoint.x, lastCheckpoint.y+1, lastCheckpoint.z);
  player.vel.set(0,0,0);
  player.yaw = yawAfter(lastCheckpoint.index);
  player.pitch = -0.12;
  el('fallmsg').style.opacity = 1;
  setTimeout(()=> el('fallmsg').style.opacity = 0, 700);
}

function updatePlatforms(t){
  for (const p of platforms){
    if (!p.moving) continue;
    const off = Math.sin(t*p.moving.speed + p.moving.phase) * p.moving.range;
    const nx = p.moving.axis==='x' ? p.baseX+off : p.baseX;
    const nz = p.moving.axis==='z' ? p.baseZ+off : p.baseZ;
    p.deltaX = nx - p.x; p.deltaZ = nz - p.z;
    p.x = nx; p.z = nz;
    p.mesh.position.set(p.x, p.y, p.z);
  }
}

function updatePlayer(dt){
  let mx=0, mz=0;
  if (keys.KeyW) mz-=1; if (keys.KeyS) mz+=1;
  if (keys.KeyA) mx-=1; if (keys.KeyD) mx+=1;
  const len = Math.max(1, Math.hypot(mx,mz)); mx/=len; mz/=len;
  const turn=2.0;
  if (keys.ArrowLeft) player.yaw += turn*dt;
  if (keys.ArrowRight) player.yaw -= turn*dt;
  if (keys.ArrowUp) player.pitch = Math.min(1.5, player.pitch+turn*0.6*dt);
  if (keys.ArrowDown) player.pitch = Math.max(-1.5, player.pitch-turn*0.6*dt);

  const speed = 5.6;
  const sin=Math.sin(player.yaw), cos=Math.cos(player.yaw);
  const wishX = (mx*cos+mz*sin)*speed, wishZ=(mz*cos-mx*sin)*speed;
  player.vel.x += (wishX-player.vel.x)*Math.min(1,10*dt);
  player.vel.z += (wishZ-player.vel.z)*Math.min(1,10*dt);
  player.vel.y -= 22*dt;
  if (keys.Space && player.onGround){ player.vel.y = 8.2; player.onGround=false; }
  player.vel.y = Math.max(player.vel.y, -40);

  // carry player along a moving platform they're standing on
  if (player.onGround && player.standingOn && player.standingOn.moving){
    player.pos.x += player.standingOn.deltaX||0;
    player.pos.z += player.standingOn.deltaZ||0;
  }

  player.pos.x += player.vel.x*dt;
  player.pos.z += player.vel.z*dt;
  player.pos.y += player.vel.y*dt;

  // landing check: find a platform under the player within a small vertical window
  player.onGround = false; player.standingOn = null;
  for (const p of platforms){
    const dx = Math.abs(player.pos.x - p.x), dz = Math.abs(player.pos.z - p.z);
    if (dx > p.w/2+0.35 || dz > p.d/2+0.35) continue;
    const top = p.y + 0.3;
    if (player.pos.y >= top - 0.05 && player.pos.y <= top + 0.5 && player.vel.y <= 0.05){
      player.pos.y = top;
      player.vel.y = 0;
      player.onGround = true;
      player.standingOn = p;
      if (p.checkpoint){
        const idx = checkpoints.findIndex(c=>c.x===p.baseX && c.z===p.baseZ);
        lastCheckpoint = { x:p.x, y:p.y, z:p.z, index:p.index };
        if (idx > player.stage){ player.stage = idx; el('stage').querySelector('b').textContent = idx+1; }
      }
      if (p.finish && !finished){
        finished = true;
        const secs = ((performance.now()-startTime)/1000).toFixed(1);
        el('winTime').textContent = `Time: ${secs}s`;
        el('win').style.display='flex';
        document.exitPointerLock?.();
      }
      break;
    }
  }
  if (player.pos.y < -20) respawn();

  camera.position.set(player.pos.x, player.pos.y+1.5, player.pos.z);
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
}

let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  const running = el('hud').classList.contains('hidden')===false && !finished;
  if (running){ updatePlatforms(now/1000); updatePlayer(dt); }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

el('playBtn').addEventListener('click', ()=>{
  el('start').classList.add('hidden');
  el('hud').classList.remove('hidden');
  startTime = performance.now();
  if (!isTouch) renderer.domElement.requestPointerLock();
});
el('againBtn').addEventListener('click', ()=>{
  el('win').style.display='none';
  finished = false; player.stage = 0; lastCheckpoint = checkpoints[0];
  player.pos.set(platforms[0].x, platforms[0].y+1, platforms[0].z);
  player.vel.set(0,0,0);
  player.yaw = yawAfter(0); player.pitch = -0.12;
  el('stage').querySelector('b').textContent = 1;
  startTime = performance.now();
  if (!isTouch) renderer.domElement.requestPointerLock();
});
</script>
</body>
</html>
